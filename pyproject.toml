[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "document-agent"
version = "0.1.0"
description = "An intelligent agent capable of writing and rewriting documents based on the content of an organization's self-built knowledge base"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.2.11",
    "langchain-core>=1.6.2",
    "langchain-openai>=1.6.2",
    "openai>=3.11.0",
    "pydantic>=2.13.5",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "lxml>=5.2.1",
    "math2docx>=3.1.0",
    "officemath2latex>=0.1.1",
    "pdfplumber>=0.11.10",
    "camelot-py>=0.11.0",
]

[tool.setuptools.packages.find]
where = ["src"]
