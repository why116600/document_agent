[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "document-agent"
version = "0.1.0"
description = "An intelligent agent capable of writing and rewriting documents based on the content of an organization's self-built knowledge base"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.2.11",
    "langchain-core>=1.6.2",
    "langchain-openai>=1.6.2",
    "openai>=3.11.0",
    # 远程知识图谱检索客户端（document_agent.retrieve_tool.remote_kg_tool）
    "httpx>=0.24.0",
    "pydantic>=2.13.5",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "lxml>=5.2.1",
    "math2docx>=3.1.0",
    "officemath2latex>=0.1.1",
    "pdfplumber>=0.11.10",
    "camelot-py>=0.11.0",
    # 知识图谱记忆模块（document_agent.memory.knowledge_graph）
    "neo4j>=6.3.0",
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
    # Web 版后端（document_agent.backend）
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-multipart>=0.0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# 前端页面随 Web 后端一起安装（源码运行时直接读取 static 目录）
"document_agent.backend" = ["static/*"]

